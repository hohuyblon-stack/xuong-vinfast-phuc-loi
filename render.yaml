services:
  - type: web
    name: xuong-vinfast-phuc-loi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: POE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: MANAGER_CHAT_IDS
        sync: false
      - key: OCR_CONFIDENCE_HIGH
        value: "0.8"
      - key: OCR_CONFIDENCE_MEDIUM
        value: "0.5"
      - key: ALERT_HOURS_WARNING
        value: "24"
      - key: ALERT_HOURS_URGENT
        value: "48"
      - key: DAILY_REPORT_HOUR
        value: "18"
      - key: MORNING_REPORT_HOUR
        value: "7"
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
